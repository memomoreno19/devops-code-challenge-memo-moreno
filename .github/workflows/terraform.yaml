name: Terraform deployment

on:
  # Trigger the workflow on pull requests to the main branch (DEV)
  pull_request:
    branches:
      - main

  # Trigger the workflow on pushes to the main branch (STG)
  # For production deployments, you can create a separate workflow or use manual triggers with environment protection rules.
  push:
    branches:
      - main

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.event_name == 'pull_request' && 'dev' || 'stg' }}
    env:
      ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'dev' || 'stg' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions/terraform-plan-gha-role-${{ env.ENVIRONMENT }}
          aws-region: us-west-2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.0

      - name: Initialize Terraform
        run: terraform init

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Plan Terraform deployment
        run: terraform plan -out=tfplan

      - name: Save Terraform plan as artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan

  apply:
    runs-on: ubuntu-latest
    needs: plan
    environment: 
      name: ${{ github.event_name == 'pull_request' && 'dev' || 'stg' }}
    env:
      ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'dev' || 'stg' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions/terraform-apply-gha-role-${{ env.ENVIRONMENT }}
          aws-region: us-west-2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.0

      - name: Initialize Terraform
        run: terraform init

      - name: Download Terraform plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan

      - name: Apply Terraform deployment
        run: terraform apply tfplan